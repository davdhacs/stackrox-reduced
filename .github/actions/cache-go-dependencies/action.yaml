name: Cache Go Dependencies
description: Cache GOCACHE + GOMODCACHE (save on master, restore on PRs)
inputs:
  save-cache:
    description: 'Whether to save cache after job completes (default: only on master)'
    required: false
    default: 'auto'
runs:
  using: composite
  steps:
    - name: Determine Go cache paths
      id: cache-vars
      run: |
        echo "GOCACHE=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
        echo "GOMODCACHE=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
        # Cache key: platform + arch + Go version + commit SHA.
        # No go.sum hash — GOCACHE objects are valid even when deps change
        # (Go checks each package's content hash independently).
        # Each master commit saves a fresh GOCACHE. PRs restore the latest
        # master cache via prefix match.
        platform=${RUNNER_OS:-Linux}
        arch=${RUNNER_ARCH:-X64}
        arch=${arch,,}
        versionSpec="$(go env GOVERSION)"
        versionSpec=${versionSpec#go}
        echo "key-prefix=gocache-${platform}-${arch}-go-${versionSpec}" >> "$GITHUB_OUTPUT"
        # Determine if we should save cache
        save_cache="${{ inputs.save-cache }}"
        if [[ "$save_cache" == "auto" ]]; then
          # Save on master pushes, or when ci-seed-cache label is present (for fork testing)
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/master" ]] || \
             [[ "${{ contains(github.event.pull_request.labels.*.name, 'ci-seed-cache') }}" == "true" ]]; then
            save_cache="true"
          else
            save_cache="false"
          fi
        fi
        echo "save-cache=${save_cache}" >> "$GITHUB_OUTPUT"
      shell: bash

    - name: Restore Go cache
      id: cache-restore
      uses: actions/cache/restore@v4
      with:
        path: |
          ${{ steps.cache-vars.outputs.GOCACHE }}
          ${{ steps.cache-vars.outputs.GOMODCACHE }}
        key: ${{ steps.cache-vars.outputs.key-prefix }}-${{ github.sha }}
        restore-keys: |
          ${{ steps.cache-vars.outputs.key-prefix }}-

    - name: Download Go modules
      run: |
        make deps --always-make
      shell: bash

    # NOTE: GOCACHE save is handled by the workflow (after go build),
    # not here. This action only restores + downloads modules.
